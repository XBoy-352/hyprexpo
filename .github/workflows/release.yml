name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    container:
      image: archlinux:latest

    steps:
      - name: Initialize pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            hyprland \
            pango \
            cairo \
            libdrm \
            libinput \
            pixman \
            wayland \
            libxkbcommon \
            lua \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Need the full history + tags so the build bakes the exact tag
          # version (scripts/version.sh uses `git describe`).
          fetch-depth: 0

      - name: Trust checkout inside build container
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Verify version matches tag
        run: make check-version TAG="${RELEASE_TAG}"

      - name: Verify hyprpm commit pins
        run: make check-pins REF="${RELEASE_TAG}"

      - name: Verify parser tests
        run: make test

      - name: Build plugin
        run: make all

      - name: Record build provenance
        run: |
          {
            echo "hyprctl version:"
            hyprctl version || true
            echo
            echo "pkg-config hyprland:"
            pkg-config --modversion hyprland || true
            echo
            echo "pkg-config lua5.4:"
            pkg-config --modversion lua5.4 || true
            echo
            echo "compiler:"
            c++ --version | head -n 1
            echo
            echo "ldd -r hyprexpo.so:"
            ldd -r hyprexpo.so || true
          } | tee release-provenance.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            hyprexpo.so
            release-provenance.txt
          generate_release_notes: true
